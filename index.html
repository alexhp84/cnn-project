<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MINISTRY OF VISION | Citizen Image Analysis</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
           background: linear-gradient(160deg, #eef2ff 0%, #f8fafc 60%); color: #1e293b; padding: 20px 14px 40px; }
    header { text-align: center; max-width: 560px; margin: 16px auto 20px; }
    header .logo { font-size: 2.2rem; }
    header h1 { margin: 6px 0 4px; font-size: 1.7rem; letter-spacing: -.02em; }
    header p { margin: 0; color: #64748b; }
    .card { max-width: 560px; margin: 0 auto 16px; background: #fff; border-radius: 20px; padding: 22px;
            box-shadow: 0 4px 24px rgba(30, 41, 59, .08); }

    /* upload area */
    #drop { border: 2px dashed #c7d2fe; border-radius: 16px; padding: 28px 16px; text-align: center;
            background: #f8faff; transition: .15s; }
    #drop.over { border-color: #4f46e5; background: #eef2ff; }
    #drop .big { font-size: 2.4rem; }
    #drop p { margin: 6px 0 14px; color: #64748b; }
    .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    button { font: inherit; font-weight: 600; border-radius: 12px; padding: 11px 18px; cursor: pointer;
             border: 1.5px solid #e2e8f0; background: #fff; color: #334155; transition: .15s; }
    button:hover:not(:disabled) { border-color: #a5b4fc; background: #f5f7ff; }
    button:disabled { opacity: .5; cursor: wait; }

    /* photo + scanning line */
    #box { margin-top: 16px; }
    #stage { position: relative; width: fit-content; max-width: 100%; margin: 0 auto 14px;
             border-radius: 14px; overflow: hidden; background: #0f172a; }
    #preview { display: block; max-width: 100%; max-height: 340px; }
    .scan { position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .25s; }
    #stage.scanning .scan { opacity: 1; }
    #stage.scanning #preview { filter: brightness(.85) saturate(.9); }
    .scan::before { content: ""; position: absolute; inset: 0; background: rgba(79, 70, 229, .12); }
    .scan .line { position: absolute; left: 0; right: 0; top: 0; height: 3px; background: #818cf8;
                  box-shadow: 0 0 14px 5px rgba(99, 102, 241, .75), 0 0 40px 12px rgba(99, 102, 241, .35);
                  animation: sweep 1.3s ease-in-out infinite alternate; }
    .scan .corner { position: absolute; width: 22px; height: 22px; border: 3px solid #a5b4fc; }
    .scan .tl { top: 10px; left: 10px; border-right: 0; border-bottom: 0; border-radius: 6px 0 0 0; }
    .scan .tr { top: 10px; right: 10px; border-left: 0; border-bottom: 0; border-radius: 0 6px 0 0; }
    .scan .bl { bottom: 10px; left: 10px; border-right: 0; border-top: 0; border-radius: 0 0 0 6px; }
    .scan .br { bottom: 10px; right: 10px; border-left: 0; border-top: 0; border-radius: 0 0 6px 0; }
    .scan .label { position: absolute; bottom: 12px; left: 0; right: 0; text-align: center; color: #e0e7ff;
                   font-size: .85rem; letter-spacing: .12em; text-transform: uppercase;
                   animation: pulse 1s ease-in-out infinite alternate; }
    @keyframes sweep { from { top: 0; } to { top: calc(100% - 3px); } }
    @keyframes pulse { from { opacity: .5; } to { opacity: 1; } }

    #actions { display: flex; gap: 10px; }
    #actions button { flex: 1; }

    /* results */
    #out .res { border: 1px solid #e2e8f0; border-radius: 16px; padding: 16px; margin-bottom: 12px; animation: rise .45s ease both; }
    #out .res:last-child { margin-bottom: 0; }
    .res .tag { font-size: .8rem; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: #6366f1; }
    .res .answer { font-size: 1.5rem; font-weight: 700; margin: 4px 0 6px; }
    .pill { display: inline-block; font-size: .85rem; font-weight: 600; padding: 3px 10px; border-radius: 999px;
            background: #dcfce7; color: #166534; }
    .pill.low { background: #fef3c7; color: #92400e; border-radius: 10px; line-height: 1.4; }
    .bar { display: flex; align-items: center; gap: 10px; margin-top: 8px; font-size: .92rem; }
    .bar .n { width: 120px; color: #475569; }
    .bar .t { flex: 1; height: 8px; border-radius: 6px; background: #e2e8f0; overflow: hidden; }
    .bar .f { height: 100%; width: 0; background: linear-gradient(90deg, #6366f1, #4f46e5); border-radius: 6px;
              transition: width .8s ease; }
    .bar .p { width: 52px; text-align: right; color: #64748b; }
    .msg { text-align: center; padding: 18px; border-radius: 14px; animation: rise .35s ease both; }
    .msg.error { background: #fef2f2; color: #b91c1c; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    footer { text-align: center; color: #94a3b8; font-size: .85rem; }

    /* Theme support: use the saved preference, or follow the operating system. */
    html { color-scheme: light; }
    body, .card, #drop, button, #out .res { transition: background-color .2s ease, color .2s ease, border-color .2s ease, box-shadow .2s ease; }
    #themeToggle { position: fixed; top: 14px; right: 14px; z-index: 10; padding: 9px 13px;
                   border-radius: 999px; box-shadow: 0 3px 14px rgba(30, 41, 59, .12); }
    html[data-theme="dark"] { color-scheme: dark; }
    html[data-theme="dark"] body { background: linear-gradient(160deg, #0b1120 0%, #111827 60%); color: #e5e7eb; }
    html[data-theme="dark"] header p,
    html[data-theme="dark"] #drop p,
    html[data-theme="dark"] .bar .n,
    html[data-theme="dark"] .bar .p { color: #aab7ca; }
    html[data-theme="dark"] .card { background: #172033; box-shadow: 0 4px 24px rgba(0, 0, 0, .25); }
    html[data-theme="dark"] #drop { background: #111a2b; border-color: #465579; }
    html[data-theme="dark"] #drop.over { background: #202b47; border-color: #818cf8; }
    html[data-theme="dark"] button { background: #202b40; color: #e5e7eb; border-color: #3b4963; }
    html[data-theme="dark"] button:hover:not(:disabled) { background: #2b3854; border-color: #818cf8; }
    html[data-theme="dark"] #out .res { border-color: #3b4963; }
    html[data-theme="dark"] .bar .t { background: #334155; }
    html[data-theme="dark"] .msg.error { background: #451a24; color: #fecaca; }
    html[data-theme="dark"] footer { color: #8795ab; }
    /* Surveillance-state visual direction: Orwellian, industrial, and deliberately austere. */
    :root { --state-red: #e33b3b; --state-green: #8ba88c; --mono: "Courier New", ui-monospace, monospace; }
    body { font-family: var(--mono); padding-top: 64px; background: #080a09; color: #e3e5df;
           background-image: repeating-linear-gradient(0deg, rgba(255,255,255,.018) 0, rgba(255,255,255,.018) 1px, transparent 1px, transparent 4px), radial-gradient(ellipse at top, #202520 0%, #0b0d0c 58%, #050606 100%); }
    body::before { content: ""; position: fixed; inset: 0; z-index: 20; pointer-events: none; opacity: .12;
      background: repeating-linear-gradient(0deg, transparent 0 3px, rgba(0,0,0,.7) 4px 5px); }
    body::after { content: "STATE OBSERVATION NETWORK  //  IMAGE ANALYSIS DIVISION"; position: fixed; bottom: 0; left: 0; right: 0; z-index: 21;
      padding: 7px 12px; background: var(--state-red); color: #fff; text-align: center; font: 700 .7rem var(--mono); letter-spacing: .18em; }
    header { max-width: 700px; margin: 0 auto 22px; border: 1px solid #444a42; border-top: 4px solid var(--state-red); padding: 24px 18px 18px;
      background: rgba(15,18,15,.92); position: relative; }
    header::before { content: "INTERNAL USE ONLY  •  CITIZEN OBSERVATION SYSTEM"; display: block; color: var(--state-red); font: 700 .68rem var(--mono); letter-spacing: .15em; margin-bottom: 18px; }
    header .logo { font-size: 2.7rem; filter: grayscale(1); }
    header h1 { text-transform: uppercase; font-family: var(--mono); font-size: clamp(1.5rem, 4vw, 2.4rem); letter-spacing: .06em; line-height: 1.2; }
    header p { color: #a3ab9e; font-size: .9rem; }
    .card { max-width: 700px; border-radius: 2px; border: 1px solid #3c433b; border-left: 3px solid #727a6d; background: rgba(17,20,17,.96);
      box-shadow: 0 12px 35px rgba(0,0,0,.45); }
    #drop { border-radius: 2px; border: 1px dashed #68715f; background: #0c100d; }
    #drop.over { border-color: var(--state-red); background: #211312; }
    #drop .big { filter: grayscale(1); }
    #drop p { color: #a3ab9e; }
    button { border-radius: 2px; border: 1px solid #596253; background: #20251f; color: #e7e9e2; text-transform: uppercase; font: 700 .8rem var(--mono); letter-spacing: .04em; }
    button:hover:not(:disabled) { background: #333a30; border-color: var(--state-red); }
    #themeToggle { top: 14px; right: 14px; border-color: #6e7767; box-shadow: none; }
    #stage { border-radius: 2px; border: 1px solid #737c6c; }
    .scan::before { background: rgba(227,59,59,.11); }
    .scan .line { background: var(--state-red); box-shadow: 0 0 12px 3px rgba(227,59,59,.6); }
    .scan .corner { border-color: var(--state-red); }
    .scan .label { color: #fff; font-family: var(--mono); text-shadow: 0 1px 5px #000; }
    #out .res { border-radius: 2px; border-color: #434b40; background: #101410; }
    .res .tag { color: var(--state-red); font-family: var(--mono); letter-spacing: .14em; }
    .res .tag::before { content: "[ CLASSIFICATION RECORD ] "; }
    .res .answer { text-transform: uppercase; letter-spacing: .04em; }
    .pill { border-radius: 2px; background: #263a2a; color: #c1e2c2; font-family: var(--mono); }
    .pill.low { background: #42251e; color: #ffc0a9; }
    .bar .n, .bar .p { color: #b1b9aa; font-family: var(--mono); }
    .bar .t { background: #2c332b; border-radius: 0; }
    .bar .f { background: var(--state-red); border-radius: 0; }
    .msg.error { border: 1px solid var(--state-red); border-radius: 2px; background: #281514; color: #ffb8b8; }
    footer { padding: 12px 0 26px; color: #747d70; font-family: var(--mono); text-transform: uppercase; letter-spacing: .1em; font-size: .7rem; }
    html[data-theme="light"] body { color: #20251f; background-color: #d9ddd3; background-image: repeating-linear-gradient(0deg, rgba(0,0,0,.025) 0, rgba(0,0,0,.025) 1px, transparent 1px, transparent 4px), linear-gradient(160deg,#e4e7df,#cbd1c6); }
    html[data-theme="light"] header, html[data-theme="light"] .card { background: rgba(241,243,237,.97); border-color: #a8afa1; }
    html[data-theme="light"] header p, html[data-theme="light"] #drop p { color: #50584d; }
    html[data-theme="light"] #drop { background: #e8ebe3; border-color: #929b8a; }
    html[data-theme="light"] button { background: #dce1d7; color: #20251f; border-color: #a8afa1; }
    html[data-theme="light"] button:hover:not(:disabled) { background: #cbd2c5; }
    html[data-theme="light"] #out .res { background: #f5f6f1; border-color: #b9c0b2; }
    html[data-theme="light"] .bar .n, html[data-theme="light"] .bar .p { color: #50584d; }
    html[data-theme="light"] .bar .t { background: #cbd1c6; }
    html[data-theme="light"] .msg.error { background: #f9e4e0; color: #8d1e1e; }
    html[data-theme="light"] footer { color: #50584d; }

    @media (max-width: 600px) {
      #themeToggle { position: absolute; top: 8px; right: 8px; font-size: .85rem; padding: 8px 11px; }
      header { padding-top: 34px; }
    }

    [hidden] { display: none !important; }
    #cameraPanel { margin-top: 18px; }
    #cameraPanel video { width: 100%; max-height: 60vh; object-fit: contain; background: #050505; border: 1px solid var(--line); }
    #cameraPanel .row { margin-top: 12px; }
  </style>
</head>
<body>
  <button type="button" id="themeToggle" aria-label="Switch colour theme">🌙 Dark mode</button>
  <header>
    <div class="logo" aria-hidden="true">◉</div>
    <h1>Big Brother Vision</h1>
    <p>THE SYSTEM SEES. THE SYSTEM CLASSIFIES. Remain calm. Submit an image for automated analysis.</p>
  </header>

  <div class="card">
    <div style="font:700 .7rem var(--mono); letter-spacing:.16em; color:var(--state-red); margin-bottom:14px;">● SYSTEM ONLINE &nbsp; / &nbsp; VISUAL INPUT TERMINAL 01</div>
    <div id="drop">
      <div class="big">▣</div>
      <p>Provide image for inspection</p>
      <div class="row">
        <button type="button" id="btnCam">▣ Take photo</button>
        <button type="button" id="btnGal">▤ Upload image</button>
      </div>
    </div>
    <input id="gal" type="file" accept="image/*" hidden>
    <section id="cameraPanel" hidden aria-label="Webcam capture">
      <video id="cameraVideo" autoplay playsinline muted></video>
      <div class="row">
        <button type="button" id="takeSnapshot">● Capture photo</button>
        <button type="button" id="closeCamera">Cancel</button>
      </div>
      <p id="cameraMessage" role="status"></p>
      <canvas id="cameraCanvas" hidden></canvas>
    </section>

    <div id="box" hidden>
      <div id="stage">
        <img id="preview" alt="Your image">
        <div class="scan">
          <div class="line"></div>
          <div class="corner tl"></div><div class="corner tr"></div>
          <div class="corner bl"></div><div class="corner br"></div>
          <div class="label">Scanning…</div>
        </div>
      </div>
      <div id="actions">
        <button type="button" id="save">▣ Export image</button>
        <button type="button" id="again">↻ Reprocess image</button>
      </div>
    </div>
  </div>

  <div class="card" id="out" hidden></div>
  <footer>Truth is established by the system &nbsp; // &nbsp; Powered by convolutional neural networks</footer>

<script>
const $ = id => document.getElementById(id);
const MIN_SCAN_MS = 2200;   // the scan animation always plays at least this long
const UNKNOWN_TEXT = "Unrecognisable: image quality not good enough for accuracy above 60%";
let file = null, busy = false, cameraStream = null;
const pretty = s => s.replace(/_/g, " ").replace(/^./, c => c.toUpperCase());

// ---- light/dark theme ----
const themeToggle = $("themeToggle");
const systemPrefersDark = window.matchMedia("(prefers-color-scheme: dark)");
function applyTheme(theme) {
  document.documentElement.dataset.theme = theme;
  themeToggle.textContent = theme === "dark" ? "☀️ Light mode" : "🌙 Dark mode";
  themeToggle.setAttribute("aria-label", theme === "dark" ? "Switch to light mode" : "Switch to dark mode");
}
const savedTheme = localStorage.getItem("vision-theme");
applyTheme(savedTheme || "dark");
themeToggle.addEventListener("click", () => {
  const nextTheme = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  localStorage.setItem("vision-theme", nextTheme);
  applyTheme(nextTheme);
});


// ---- webcam capture and image upload ----
$("btnCam").onclick = openCamera;
$("btnGal").onclick = () => $("gal").click();
$("gal").onchange = e => { setFile(e.target.files[0]); e.target.value = ""; };
$("takeSnapshot").onclick = capturePhoto;
$("closeCamera").onclick = closeCamera;

async function openCamera() {
  const panel = $("cameraPanel");
  const message = $("cameraMessage");
  panel.hidden = false;
  message.textContent = "Requesting camera permission…";
  $("btnCam").disabled = true;
  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      throw new Error("Webcam access is unavailable. Open this site on localhost or over HTTPS, or upload an image instead.");
    }
    cameraStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: "environment" } }, audio: false
    });
    $("cameraVideo").srcObject = cameraStream;
    await $("cameraVideo").play();
    message.textContent = "Camera ready. Position the subject and capture a photo.";
  } catch (err) {
    closeCamera();
    message.textContent = "Could not open the camera: " + err.message + ". Check browser camera permissions, or use Upload image.";
    panel.hidden = false;
  }
}

function closeCamera() {
  if (cameraStream) cameraStream.getTracks().forEach(track => track.stop());
  cameraStream = null;
  $("cameraVideo").srcObject = null;
  $("cameraPanel").hidden = true;
  $("btnCam").disabled = false;
}

function capturePhoto() {
  const video = $("cameraVideo");
  if (!video.videoWidth || !video.videoHeight) {
    $("cameraMessage").textContent = "The camera is still starting. Try again in a moment.";
    return;
  }
  const canvas = $("cameraCanvas");
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  canvas.getContext("2d").drawImage(video, 0, 0, canvas.width, canvas.height);
  canvas.toBlob(blob => {
    if (!blob) {
      $("cameraMessage").textContent = "Could not capture the photo. Please try again.";
      return;
    }
    const photo = new File([blob], `webcam-${Date.now()}.jpg`, { type: "image/jpeg" });
    closeCamera();
    setFile(photo);
  }, "image/jpeg", 0.92);
}

const drop = $("drop");
["dragenter", "dragover"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave", "drop"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", e => setFile(e.dataTransfer.files[0]));

function setFile(f) {
  if (!f || !f.type.startsWith("image/") || busy) return;
  file = f;
  $("preview").src = URL.createObjectURL(f);
  $("box").hidden = false;
  analyze();                                  // the scan starts right on upload
}

// ---- save / scan again ----
$("save").onclick = () => {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(file);
  a.download = file.name || "image.jpg";
  a.click();
};
$("again").onclick = analyze;

// ---- classify ----
function show(html) { $("out").innerHTML = html; $("out").hidden = false; }

async function analyze() {
  if (!file || busy) return;
  busy = true;
  $("out").hidden = true;
  $("stage").classList.add("scanning");
  ["again", "btnCam", "btnGal"].forEach(id => $(id).disabled = true);
  try {
    const fd = new FormData();
    fd.append("file", file);
    const [r] = await Promise.all([
      fetch("/predict", { method: "POST", body: fd }),
      new Promise(res => setTimeout(res, MIN_SCAN_MS)),
    ]);
    if (!r.ok) throw new Error("Server error " + r.status);
    render(await r.json());
  } catch (err) {
    show(`<div class="msg error">Something went wrong: ${err.message}. Is the server running?</div>`);
  } finally {
    $("stage").classList.remove("scanning");
    ["again", "btnCam", "btnGal"].forEach(id => $(id).disabled = false);
    busy = false;
  }
}

function render(d) {
  // router could not tell if it's a face or a fruit
  if (!d.results.length) {
    show(`<div class="res">
      <div class="tag">Result</div>
      <div class="answer">unknown</div>
      <span class="pill low">${UNKNOWN_TEXT}</span></div>`);
    return;
  }
  show(d.results.map(res => {
    const low = res.prediction === "unknown";
    const bars = Object.entries(res.probabilities).sort((a, b) => b[1] - a[1]).map(([n, p]) => `
      <div class="bar"><span class="n">${pretty(n)}</span>
        <div class="t"><div class="f" data-w="${(p * 100).toFixed(1)}"></div></div>
        <span class="p">${(p * 100).toFixed(1)}%</span></div>`).join("");
    return `<div class="res">
      <div class="tag">${res.model}</div>
      <div class="answer">${low ? "unknown" : pretty(res.prediction)}</div>
      <span class="pill ${low ? "low" : ""}">${low ? UNKNOWN_TEXT : (res.confidence * 100).toFixed(1) + "% confident"}</span>
      ${bars}</div>`;
  }).join(""));
  // animate the probability bars once the cards are in the page
  requestAnimationFrame(() => requestAnimationFrame(() =>
    document.querySelectorAll("#out .f").forEach(el => el.style.width = el.dataset.w + "%")));
  $("out").scrollIntoView({ behavior: "smooth", block: "nearest" });
}
</script>
</body>
</html>
